[package]
name = "webhook-mailbox"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
hex = "0.4.3"
sha2 = "0.10.9"
socket2 = "0.6.5"
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
rand = "0.8.5"
tokio = { version = "1.53.2", features = ["io-util"] }
